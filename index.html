<div class="card">

    <div class="controls">
        <div class="file-area">

            <label title="自动忽略面积特别大的背景连通块">

        </button>
    </div>

    <div class="preview-wrapper">
        <div class="canvas-container" id="canvasContainer">
            <div class="drag-overlay" id="dragOverlay">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                松开即可上传图片
            </div>
            <canvas id="previewCanvas" style="display: none;"></canvas>

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5-6 6-3-3-5 5"/></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
    (function() {
        const imageInput = document.getElementById('imageInput');
        const fileNameSpan = document.getElementById('fileName');
        const toleranceInput = document.getElementById('tolerance');
        const minAreaInput = document.getElementById('minArea');
        const ignoreBgCheck = document.getElementById('ignoreBg');
        const sliceBtn = document.getElementById('sliceBtn');
        const previewCanvas = document.getElementById('previewCanvas');
        const placeholder = document.getElementById('placeholder');
        const canvasContainer = document.getElementById('canvasContainer');
        const statusText = document.getElementById('statusText');
        const resultArea = document.getElementById('resultArea');
        const piecesGrid = document.getElementById('piecesGrid');
        const pieceCountSpan = document.getElementById('pieceCount');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        let originalImage = null;
        let currentImageSrc = '';
        let slicedPieces = [];
        let imageDataCache = null;

        function showPreview(img) {
            const ctx = previewCanvas.getContext('2d');
            const maxW = 900, maxH = 600;
            let w = img.width, h = img.height;
            if (w > maxW || h > maxH) {
                const ratio = Math.min(maxW / w, maxH / h);
                w = Math.floor(w * ratio);
                h = Math.floor(h * ratio);
            }
            previewCanvas.width = w;
            previewCanvas.height = h;
            previewCanvas.style.display = 'block';
            placeholder.style.display = 'none';
            canvasContainer.classList.add('has-image');
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
        }

        function setStatus(text, isError = false) {
            statusText.textContent = text;
            statusText.style.color = isError ? '#b33a3a' : '#3865a0';
            statusText.style.background = isError ? '#ffeaea' : '#eaf1fe';
        }

        function loadImageFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('请选择有效的图片文件');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    currentImageSrc = e.target.result;
                    fileNameSpan.textContent = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
                    showPreview(img);
                    slicedPieces = [];
                    imageDataCache = null;
                    resultArea.style.display = 'none';
                    piecesGrid.innerHTML = '';
                    sliceBtn.disabled = false;
                    setStatus(`图片已加载 · ${img.width} × ${img.height} 像素`);
                };
                img.onerror = () => alert('图片加载失败');
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function getImageData() {
            if (!originalImage) return null;
            if (imageDataCache) return imageDataCache;
            const canvas = document.createElement('canvas');
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(originalImage, 0, 0);
            imageDataCache = ctx.getImageData(0, 0, canvas.width, canvas.height);
            return imageDataCache;
        }

        async function findComponents(imageData, tolerance = 25, minArea = 100, ignoreLargeBackground = true) {
            const { width, height, data } = imageData;
            const totalPixels = width * height;

            function getBackgroundColor() {
                const colorMap = new Map();
                const sample = (x, y) => {
                    const idx = (y * width + x) * 4;
                    const key = `${Math.round(data[idx]/8)},${Math.round(data[idx+1]/8)},${Math.round(data[idx+2]/8)},${Math.round(data[idx+3]/8)}`;
                    colorMap.set(key, (colorMap.get(key) || 0) + 1);
                };
                for (let x = 0; x < width; x += Math.max(1, Math.floor(width / 100))) {
                    sample(x, 0);
                    sample(x, height - 1);
                }
                for (let y = 0; y < height; y += Math.max(1, Math.floor(height / 100))) {
                    sample(0, y);
                    sample(width - 1, y);
                }
                let maxCount = 0, bgColor = { r: 255, g: 255, b: 255, a: 0 };
                for (const [key, count] of colorMap) {
                    if (count > maxCount) {
                        maxCount = count;
                        const [r, g, b, a] = key.split(',').map(Number);
                        bgColor = { r: r * 8, g: g * 8, b: b * 8, a: a * 8 };
                    }
                }
                return bgColor;
            }

            const bgColor = getBackgroundColor();
            const mask = new Uint8Array(totalPixels);
            for (let i = 0; i < totalPixels; i++) {
                const idx = i * 4;
                const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
                const dr = Math.abs(r - bgColor.r);
                const dg = Math.abs(g - bgColor.g);
                const db = Math.abs(b - bgColor.b);
                const da = Math.abs(a - bgColor.a);
                const diff = dr + dg + db + da * 2;
                if (a < 10) {
                    mask[i] = 0;
                } else if (diff > tolerance * 3) {
                    mask[i] = 1;
                } else {
                    mask[i] = 0;
                }
            }

            const labelMap = new Int32Array(totalPixels);
            const parent = [0];
            let nextLabel = 1;

            function find(x) {
                while (parent[x] !== x) {
                    parent[x] = parent[parent[x]];
                    x = parent[x];
                }
                return x;
            }

            function union(x, y) {
                const rx = find(x), ry = find(y);
                if (rx !== ry) parent[ry] = rx;
            }

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = y * width + x;
                    if (mask[i] === 0) continue;
                    const left = x > 0 ? labelMap[i - 1] : 0;
                    const up = y > 0 ? labelMap[i - width] : 0;
                    const upLeft = (x > 0 && y > 0) ? labelMap[i - width - 1] : 0;
                    const upRight = (x < width - 1 && y > 0) ? labelMap[i - width + 1] : 0;
                    const neighbors = [];
                    if (left > 0) neighbors.push(left);
                    if (up > 0) neighbors.push(up);
                    if (upLeft > 0) neighbors.push(upLeft);
                    if (upRight > 0) neighbors.push(upRight);
                    if (neighbors.length === 0) {
                        labelMap[i] = nextLabel;
                        parent[nextLabel] = nextLabel;
                        nextLabel++;
                    } else {
                        const minLabel = Math.min(...neighbors);
                        labelMap[i] = minLabel;
                        for (const n of neighbors) {
                            if (n !== minLabel) union(minLabel, n);
                        }
                    }
                }
            }

            const components = new Map();
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = y * width + x;
                    if (labelMap[i] === 0) continue;
                    const root = find(labelMap[i]);
                    labelMap[i] = root;
                    if (!components.has(root)) {
                        components.set(root, { label: root, minX: x, maxX: x, minY: y, maxY: y, area: 0 });
                    }
                    const comp = components.get(root);
                    if (x < comp.minX) comp.minX = x;
                    if (x > comp.maxX) comp.maxX = x;
                    if (y < comp.minY) comp.minY = y;
                    if (y > comp.maxY) comp.maxY = y;
                    comp.area++;
                }
            }

            let compArray = Array.from(components.values());
            compArray = compArray.filter(c => c.area >= minArea);

            if (ignoreLargeBackground && compArray.length > 0) {
                const totalArea = width * height;
                const areas = compArray.map(c => c.area).sort((a, b) => a - b);
                const median = areas[Math.floor(areas.length / 2)];
                compArray = compArray.filter(c => {
                    if (c.area > median * 10 && c.area > totalArea * 0.15) return false;
                    return true;
                });
            }

            compArray.sort((a, b) => {
                const rowThreshold = height * 0.1;
                if (Math.abs(a.minY - b.minY) > rowThreshold) return a.minY - b.minY;
                return a.minX - b.minX;
            });

            return compArray;
        }

        function sliceByComponents(imageData, components) {
            if (!imageData) return [];
            const pieces = [];
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            for (let i = 0; i < components.length; i++) {
                const comp = components[i];
                const x = comp.minX, y = comp.minY;
                const w = comp.maxX - comp.minX + 1;
                const h = comp.maxY - comp.minY + 1;
                if (w <= 0 || h <= 0) continue;
                tempCanvas.width = w;
                tempCanvas.height = h;
                tempCtx.clearRect(0, 0, w, h);
                tempCtx.drawImage(originalImage, x, y, w, h, 0, 0, w, h);
                const dataUrl = tempCanvas.toDataURL('image/png');
                pieces.push({
                    dataUrl, index: i + 1, width: w, height: h,
                    fileName: `tile_${String(i + 1).padStart(3, '0')}_${w}x${h}.png`,
                    x, y
                });
            }
            return pieces;
        }

        async function sliceImage() {
            if (!originalImage) { alert('请先上传图片'); return; }
            sliceBtn.disabled = true;
            const originalBtnHtml = sliceBtn.innerHTML;
            sliceBtn.innerHTML = '<span class="spinner"></span> 分析中…';
            try {
                const imageData = getImageData();
                if (!imageData) throw new Error('无法获取图像数据');
                const tolerance = Math.max(0, Math.min(255, parseInt(toleranceInput.value) || 25));
                const minArea = Math.max(1, parseInt(minAreaInput.value) || 100);
                const ignoreBg = ignoreBgCheck.checked;
                setStatus('正在分析连通区域，请稍候…（大图可能需要几秒）');
                await new Promise(r => setTimeout(r, 30));
                const t0 = performance.now();
                const components = await findComponents(imageData, tolerance, minArea, ignoreBg);
                const t1 = performance.now();
                if (components.length === 0) {
                    setStatus('❌ 未检测到任何小图，请尝试调整容差或最小面积', true);
                    alert('未检测到小图。\n\n建议：\n1. 增大"容差"值\n2. 减小"最小面积"值\n3. 关闭"忽略背景"试试');
                    return;
                }
                const pieces = sliceByComponents(imageData, components);
                slicedPieces = pieces;
                renderPieces(pieces);
                resultArea.style.display = 'block';
                pieceCountSpan.textContent = `${pieces.length} 张小图`;
                setStatus(`✅ 完成 · 检测到 ${pieces.length} 个小图 · 耗时 ${((t1 - t0) / 1000).toFixed(2)}s`);
            } catch (err) {
                console.error(err);
                setStatus(`❌ 出错: ${err.message}`, true);
                alert(`切割过程出错: ${err.message}`);
            } finally {
                sliceBtn.disabled = false;
                sliceBtn.innerHTML = originalBtnHtml;
            }
        }

        function renderPieces(pieces) {
            piecesGrid.innerHTML = '';
            if (pieces.length === 0) {
                piecesGrid.innerHTML = '<div style="color:#8ba0bc; padding:20px;">没有小图</div>';
                return;
            }
            pieces.forEach(piece => {
                const card = document.createElement('div');
                card.className = 'piece-card';
                const img = document.createElement('img');
                img.src = piece.dataUrl;
                img.alt = piece.fileName;
                img.loading = 'lazy';
                img.addEventListener('click', () => downloadPiece(piece));
                const label = document.createElement('div');
                label.className = 'piece-label';
                label.textContent = `${piece.width}×${piece.height}`;
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-piece';
                downloadBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> 下载`;
                downloadBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    downloadPiece(piece);
                });
                card.appendChild(img);
                card.appendChild(label);
                card.appendChild(downloadBtn);
                piecesGrid.appendChild(card);
            });
        }

        function downloadPiece(piece) {
            const link = document.createElement('a');
            link.href = piece.dataUrl;
            link.download = piece.fileName || `tile_${piece.index}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function downloadAllAsZip() {
            if (!slicedPieces || slicedPieces.length === 0) {
                alert('没有可下载的小图，请先切割图片');
                return;
            }
            if (typeof JSZip === 'undefined') {
                alert('JSZip 库未加载，请检查网络');
                return;
            }
            const zip = new JSZip();
            for (const piece of slicedPieces) {
                const base64Data = piece.dataUrl.split(',')[1];
                if (base64Data) zip.file(piece.fileName, base64Data, { base64: true });
            }
            try {
                const blob = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `sliced_tiles_${Date.now()}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 2000);
            } catch (err) {
                console.error(err);
                alert('打包下载失败，请重试');
            }
        }

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadImageFile(file);
        });
        sliceBtn.addEventListener('click', sliceImage);
        downloadAllBtn.addEventListener('click', downloadAllAsZip);

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            canvasContainer.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });
        canvasContainer.addEventListener('dragenter', (e) => {
            e.preventDefault();
            canvasContainer.classList.add('drag-active');
        });
        canvasContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            canvasContainer.classList.add('drag-active');
            e.dataTransfer.dropEffect = 'copy';
        });
        canvasContainer.addEventListener('dragleave', (e) => {
            e.preventDefault();
            const related = e.relatedTarget;
            if (related && canvasContainer.contains(related)) return;
            canvasContainer.classList.remove('drag-active');
        });
        canvasContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            canvasContainer.classList.remove('drag-active');
            const dt = e.dataTransfer;
            if (!dt) return;
            if (dt.files && dt.files.length > 0) {
                const file = dt.files[0];
                if (file.type.startsWith('image/')) loadImageFile(file);
                else alert('请拖入图片文件（PNG/JPG/WebP 等）');
                return;
            }
            const url = dt.getData('text/uri-list') || dt.getData('text/plain');
            if (url) {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    originalImage = img;
                    currentImageSrc = img.src;
                    fileNameSpan.textContent = '来自网页的图片';
                    showPreview(img);
                    slicedPieces = [];
                    imageDataCache = null;
                    resultArea.style.display = 'none';
                    piecesGrid.innerHTML = '';
                    sliceBtn.disabled = false;
                    setStatus(`图片已加载 · ${img.width} × ${img.height} 像素`);
                };
                img.onerror = () => alert('无法加载该图片链接，可能受跨域限制');
                img.src = url;
            }
        });

        canvasContainer.addEventListener('click', (e) => {
            if (e.target === previewCanvas) return;
            if (canvasContainer.classList.contains('has-image')) return;
            imageInput.click();
        });

        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => e.preventDefault());

        [toleranceInput, minAreaInput].forEach(inp => {
            inp.addEventListener('change', () => {
                let v = parseInt(inp.value);
                if (isNaN(v) || v < 0) v = 0;
                if (inp === toleranceInput && v > 255) v = 255;
                if (inp === minAreaInput && v < 1) v = 1;
                inp.value = v;
            });
        });
    })();
</script>
</body>
</html>
